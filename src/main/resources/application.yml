server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/landgo
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 180000
      max-lifetime: 240000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: users
    open-in-view: false
  liquibase:
    enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:myVeryLongSecretKeyThatIsAtLeast256BitsForHS256Algorithm2024!}
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
  services:
    core-service-url: ${CORE_SERVICE_URL:http://localhost:8082}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  mail:
    from: ${MAIL_FROM:noreply@landgo.com}
    reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password}
    verify-link-url: ${VERIFY_LINK_URL:http://localhost:3000/verify-email}
    logo-url: ${MAIL_LOGO_URL:https://landgo.app/logo_with_tagline.png}
    verification-template: ${VERIFICATION_EMAIL_TEMPLATE:email-templates/verification-email.html}
  push:
    worker:
      # How often the queue is polled. sendNow campaigns must reach a terminal state in seconds.
      interval-ms: ${PUSH_WORKER_INTERVAL_MS:15000}
      recovery-interval-ms: ${PUSH_WORKER_RECOVERY_INTERVAL_MS:60000}
      batch-size: ${PUSH_WORKER_BATCH_SIZE:25}
      stale-after-minutes: ${PUSH_WORKER_STALE_AFTER_MINUTES:5}
      max-attempts: ${PUSH_WORKER_MAX_ATTEMPTS:3}
  newsletter:
    # Public unsubscribe endpoint linked from the footer of every outbound newsletter.
    unsubscribe-url: ${NEWSLETTER_UNSUBSCRIBE_URL:https://landgo.ca/newsletter/unsubscribe}
    worker:
      interval-ms: ${NEWSLETTER_WORKER_INTERVAL_MS:15000}
      # Broadcasts are long-running, so stale detection is far more patient than for push.
      recovery-interval-ms: ${NEWSLETTER_WORKER_RECOVERY_INTERVAL_MS:300000}
      batch-size: ${NEWSLETTER_WORKER_BATCH_SIZE:1}
      stale-after-minutes: ${NEWSLETTER_WORKER_STALE_AFTER_MINUTES:30}
      max-attempts: ${NEWSLETTER_WORKER_MAX_ATTEMPTS:3}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      web-client-id: ${GOOGLE_CLIENT_ID_WEB:}
      android-client-id: ${GOOGLE_CLIENT_ID_ANDROID:}
      ios-client-id: ${GOOGLE_CLIENT_ID_IOS:}
      additional-audiences: ${GOOGLE_CLIENT_ADDITIONAL_AUDIENCES:}
      secret-name: ${GOOGLE_OAUTH_SECRET_NAME:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
  liquibase:
    public:
      enabled: ${LIQUIBASE_PUBLIC_ENABLED:true}
      change-log: ${LIQUIBASE_PUBLIC_CHANGELOG:classpath:db/changelog/public/db.changelog-master.yaml}
      default-schema: ${LIQUIBASE_PUBLIC_SCHEMA:public}
      liquibase-schema: ${LIQUIBASE_PUBLIC_LIQUIBASE_SCHEMA:public}
      change-log-table: ${LIQUIBASE_PUBLIC_CHANGELOG_TABLE:databasechangelog_user_public}
      change-log-lock-table: ${LIQUIBASE_PUBLIC_CHANGELOG_LOCK_TABLE:databasechangeloglock_user_public}
      drop-first: false
    users:
      enabled: ${LIQUIBASE_USERS_ENABLED:true}
      change-log: ${LIQUIBASE_USERS_CHANGELOG:classpath:db/changelog/users/db.changelog-master.yaml}
      default-schema: ${LIQUIBASE_USERS_SCHEMA:users}
      liquibase-schema: ${LIQUIBASE_USERS_LIQUIBASE_SCHEMA:users}
      change-log-table: ${LIQUIBASE_USERS_CHANGELOG_TABLE:databasechangelog_users}
      change-log-lock-table: ${LIQUIBASE_USERS_CHANGELOG_LOCK_TABLE:databasechangeloglock_users}
      drop-first: false

aws:
  region: ${AWS_REGION:ca-central-1}
  s3:
    images-bucket: ${AWS_S3_IMAGES_BUCKET:landgo-dev-images-local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  sendgrid:
    api-key: ${TWILIO_SENDGRID_API_KEY:}
    from-email: ${TWILIO_SENDGRID_FROM_EMAIL:noreply@landgo.ca}
    from-name: ${TWILIO_SENDGRID_FROM_NAME:LandGo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.landgo: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

firebase:
  service-account:
    base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
